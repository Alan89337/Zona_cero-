<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZONA CERO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080808;color:#fff;font-family:monospace;overflow:hidden;touch-action:none}
#ui{position:absolute;top:0;left:0;width:100%;padding:12px;display:flex;justify-content:space-between;z-index:10;font-weight:bold;color:#ff7a00}
#game{width:100vw;height:100vh;display:block;background:radial-gradient(#1a1a1a,#000)}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;background:#000000e6;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
h1{font-size:48px;color:#ff7a00;letter-spacing:4px;text-shadow:0 0 20px #ff7a00}
.btn{margin-top:20px;padding:14px 40px;background:#ff7a00;color:#000;border:none;font-weight:bold;font-size:18px;border-radius:8px}
p{color:#888;margin-top:10px}
</style>
</head>
<body>
<div id="ui"><span id="score">PUNTOS: 0</span><span id="hp">VIDA: 100</span></div>
<div id="menu"><h1>ZONA CERO</h1><p>sobrevive lo mas que puedas</p><button class="btn" onclick="start()">JUGAR</button></div>
<canvas id="game"></canvas>
<script>
const C=document.getElementById('game'),X=C.getContext('2d');let W,H,player,bullets,enemies,score,hp,run,keys={},last=0;
function resize(){W=C.width=innerWidth;H=C.height=innerHeight}resize();addEventListener('resize',resize);
player={x:0,y:0,r:18,speed:4};bullets=[];enemies=[];score=0;hp=100;
function start(){document.getElementById('menu').style.display='none';player.x=W/2;player.y=H/2;score=0;hp=100;bullets=[];enemies=[];run=true;requestAnimationFrame(loop)}
function loop(t){if(!run)return;let dt=t-last;last=t;update();draw();requestAnimationFrame(loop)}
function update(){
let mx=0,my=0;if(keys['w']||keys['ArrowUp'])my=-1;if(keys['s']||keys['ArrowDown'])my=1;if(keys['a']||keys['ArrowLeft'])mx=-1;if(keys['d']||keys['ArrowRight'])mx=1;
player.x+=mx*player.speed;player.y+=my*player.speed;player.x=Math.max(player.r,Math.min(W-player.r,player.x));player.y=Math.max(player.r,Math.min(H-player.r,player.y));
if(Math.random()<0.03+score*0.0001){let a=Math.random()*6.28,r=Math.max(W,H);enemies.push({x:player.x+Math.cos(a)*r,y:player.y+Math.sin(a)*r,r:14+Math.random()*10,speed:1+Math.random()*1.5+score*0.002})}
bullets.forEach(b=>{b.x+=Math.cos(b.a)*b.s;b.y+=Math.sin(b.a)*b.s});enemies.forEach(e=>{let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed;e.y+=Math.sin(a)*e.speed});
for(let i=bullets.length-1;i>=0;i--)for(let j=enemies.length-1;j>=0;j--){let b=bullets[i],e=enemies[j];if(Math.hypot(b.x-e.x,b.y-e.y)<e.r+4){bullets.splice(i,1);enemies.splice(j,1);score+=10;break}}
for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(player.x-e.x,player.y-e.y)<player.r+e.r){enemies.splice(j,1);hp-=15;if(hp<=0){run=false;document.getElementById('menu').style.display='flex';document.querySelector('#menu p').innerText='Puntaje: '+score}}}}
bullets=bullets.filter(b=>b.x>0&&b.x<W&&b.y>0&&b.y<H);
document.getElementById('score').innerText='PUNTOS: '+score;document.getElementById('hp').innerText='VIDA: '+hp;
}
function draw(){X.clearRect(0,0,W,H);X.strokeStyle='#111';for(let i=0;i<W;i+=40){X.beginPath();X.moveTo(i,0);X.lineTo(i,H);X.stroke()}for(let i=0;i<H;i+=40){X.beginPath();X.moveTo(0,i);X.lineTo(W,i);X.stroke()}
X.fillStyle='#ff7a00';X.beginPath();X.arc(player.x,player.y,player.r,0,6.28);X.fill();X.fillStyle='#fff';X.font='12px monospace';X.fillText('+',player.x-4,player.y+4);
X.fillStyle='#ff3b';enemies.forEach(e=>{X.beginPath();X.arc(e.x,e.y,e.r,0,6.28);X.fill()});X.fillStyle='#00ff88';bullets.forEach(b=>{X.beginPath();X.arc(b.x,b.y,4,0,6.28);X.fill()})}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
C.addEventListener('mousedown',shoot);C.addEventListener('touchstart',e=>{e.preventDefault();let t=e.touches[0];shoot({clientX:t.clientX,clientY:t.clientY});let sx=t.clientX,sy=t.clientY;function move(ev){let nt=ev.touches[0];let dx=nt.clientX-sx,dy=nt.clientY-sy;keys['w']=dy<-10;keys['s']=dy>10;keys['a']=dx<-10;keys['d']=dx>10}function end(){keys['w']=keys['a']=keys['s']=keys['d']=false;C.removeEventListener('touchmove',move);C.removeEventListener('touchend',end)}C.addEventListener('touchmove',move);C.addEventListener('touchend',end)},{passive:false});
function shoot(e){if(!run)return;let a=Math.atan2(e.clientY-player.y,e.clientX-player.x);bullets.push({x:player.x,y:player.y,a:a,s:10})}
</script>
</body>
</html>
