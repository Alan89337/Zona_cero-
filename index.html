<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zona Cero</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif;text-align:center}h1{color:#ff7a00}canvas{background:#111;border:2px solid #ff7a00;border-radius:12px}</style></head><body><h1>ZONA CERO</h1><p>Toca para jugar</p><canvas id="c" width="320" height="500"></canvas><script>const C=document.getElementById('c'),X=C.getContext('2d');let y=250,v=0,o=[];function L(){X.clearRect(0,0,320,500);X.fillStyle='#ff7a00';X.fillRect(150,y,20,20);v+=0.4;y+=v;o.forEach(e=>{e.y+=3;X.fillStyle='#666';X.fillRect(e.x,e.y,40,12);});if(Math.random()<0.05)o.push({x:Math.random()*280,y:-10});if(y>500||y<0){y=250;v=0;o=[];}requestAnimationFrame(L);}L();C.addEventListener('touchstart',()=>v=-7);C.addEventListener('mousedown',()=>v=-7);</script></body></html>
